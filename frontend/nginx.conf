server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. The CSP allowlists only our origin plus the product image host.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://fakestoreapi.com; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Everything under /api goes to Laravel's front controller.
    location /api/ {
        rewrite ^ /index.php last;
    }

    # Reachable only through the rewrite above, never directly by a client.
    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;

        # Set (never append) what Laravel's trusted-proxy handling reads, so clients cannot spoof
        # their address, host or scheme. A fastcgi_param also suppresses the client's header.
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_PORT $server_port;
        fastcgi_param HTTP_X_FORWARDED_PREFIX "";

        fastcgi_read_timeout 15s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
